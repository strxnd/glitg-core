# GLITG Core configuration schema. Unknown keys are preserved on reload.
config-version: 1
locale: en
update-checker: false

features:
  # When false, operators administer the server but still obey gameplay restrictions.
  operator-bypass: false
  item-rules: true
  item-limits: true
  potion-policy: true
  enchant-policy: true
  unique-items: true
  custom-crafting: true
  protected-items: true
  combat-tag: true
  cooldowns: true
  damage-caps: true
  protections: true
  grace: true
  death-system: true
  join-kit: false
  dimensions: true
  locator-bar: true
  xp-clumps: true
  shield-tweaks: true
  one-player-sleep: true
  global-pvp: true
  pvp-damage: true
  health-indicator: false
  admin-utilities: true
  altars: false
  rituals: false
  villagers: false
  golden-heads: false
  warden-heart: false
  miscellaneous: true

items:
  limit-scope: CARRIED
  include-ender-chest: false
  overflow: BLOCK
  audit-insertions: true
  audit-interval-ticks: 100
  traverse-shulkers: true
  traverse-bundles: true
  grandfather-existing-mythical: true

combat:
  duration-seconds: 15
  block-commands: true
  whitelisted-commands: [msg, tell, w, reply, r, combat]
  block-safe-regions: true
  disconnect-action: KILL
  danger-logging:
    enabled: true
    duration-seconds: 15
    disconnect-action: KILL
  restrictions:
    elytra: true
    lava: true
    ice: true
    draining: true
    armour-switching: true
    armour-restocking: true
    container-restocking: true

cooldowns:
  shield: 5s
  ender_pearl: 10s
  wind_charge: 5s
  trident: 3s
  enchanted_golden_apple: 60s
  mace: 5s
  spear: 5s
  lunge: 5s

damage-caps:
  # Values are health points: 2 health points = 1 heart.
  mace: 16.0
  spear: 16.0
  end_crystal: 24.0
  respawn_anchor: 24.0
  bed_explosion: 24.0
  bad_respawn_point: 24.0
  tnt_minecart: 20.0
  tnt: 20.0
  projectile: 20.0
  fall: 20.0

protections:
  afk:
    enabled: false
    activation-seconds: 300
    command-delay-seconds: 10
  naked:
    enabled: false
    require-empty-armor: true
  new-player:
    enabled: false
    duration-seconds: 3600
  post-death:
    enabled: true
    duration-seconds: 1800
    block-item-pickup: true
    block-container-access: true

grace:
  active-on-startup: false
  duration-seconds: 3600
  start-actions:
    - dimension schedule end 604800
    - anonymousdeaths start 604800

death:
  spectator-on-death: false
  death-ban-seconds: 0
  custom-message: ''
  sound: ''

dimensions:
  nether-locked: false
  end-locked: true

locator-bar:
  enabled: false

xp-clumps:
  radius: 4.0
  maximum-experience: 10000

shield-tweaks:
  correct-block-sound: true
  disable-cooldown-ticks: 5
  skip-vanilla-damage-ticks: false

sleep:
  players-sleeping-percentage: 1

pvp:
  enabled: true
  damage-multiplier: 1.0

health-indicator:
  label: '<red>❤</red>'

villagers:
  infinite-restock: false
  anchor-on-click: false
  prevent-killing: false

misc:
  hide-invisible-deaths-until: ''
  hide-invisible-kills: false
  hide-invisible-deaths: false
  ban-bed-bombing: true
  ban-respawn-anchor-bombing: true
  breeze-rod-drop-multiplier: 2
  happy-ghast-speed-multiplier: 1.0
  ban-tipped-arrows: true
  ban-breach-swapping: false
  prevent-string-duper: false
  anti-draining: false
  anti-dura: false
  attribute-swapping: false
  better-pearl-catching: false

custom-spawn: {}
